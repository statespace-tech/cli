name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          asset="ssp-${{ matrix.target }}.tar.gz"
          mkdir -p dist package
          cp "target/${{ matrix.target }}/release/ssp" package/ssp
          cp LICENSE package/LICENSE
          tar -C package -czf "dist/${asset}" ssp LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ssp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Release bundle
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ssp-*
          path: dist
          merge-multiple: true
      - name: Add installer
        run: cp install.sh dist/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  crates-io:
    name: Publish crate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crate version
        id: crate
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${version}" >&2
            exit 1
          fi
          response=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'statespace-release-workflow (https://github.com/statespace-tech/cli)' \
            "https://crates.io/api/v1/crates/statespace-cli/${version}")
          case "$response" in
            200) published=true ;;
            404) published=false ;;
            *) echo "crates.io returned HTTP ${response}" >&2; exit 1 ;;
          esac
          echo "published=${published}" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crate.outputs.published != 'true'
        id: auth
      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          --verify-tag
