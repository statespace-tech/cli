name: Feature request
description: Propose a focused Statespace improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Statespace solve?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: Show the proposed CLI, SDK, HTTP, or data interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives did you consider?
