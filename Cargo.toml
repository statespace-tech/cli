[package]
name = "statespace-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
authors = ["Statespace Technologies, Inc."]
homepage = "https://statespace.com"
documentation = "https://docs.statespace.com"
repository = "https://github.com/statespace-tech/cli"
description = "Run A/B tests in production and read their results"
readme = "README.md"
keywords = ["experimentation", "ab-testing", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.lock", "CHANGELOG.md", "LICENSE", "NOTICE", "README.md"]

[[bin]]
name = "ssp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
ed25519-dalek = "2"
flate2 = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.9"
webbrowser = "1"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
lto = "thin"
strip = true
