[package]
name = "statespace-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Statespace Technologies, Inc."]
homepage = "https://statespace.com"
repository = "https://github.com/statespace-tech/cli"
description = "CLI for A/B testing AI agents with Statespace"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.lock", "CHANGELOG.md", "LICENSE", "README.md"]
keywords = ["experimentation", "ab-testing", "duckdb", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ssp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
webbrowser = "1.0"
